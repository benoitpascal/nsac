<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:title" content="Project Arcadia" />
    <meta property="og:description" content="Run a base on the Moon and learn the real trade-offs of space engineering." />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An astronaut looking at the Earth, the Moon and Mars, with the Project Arcadia logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Project Arcadia" />
    <meta name="twitter:description" content="Run a base on the Moon and learn the real trade-offs of space engineering." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/home.css" />
  </head>
  <body class="arcadia arcadia--home">
    <video class="page-video" autoplay muted loop playsinline preload="auto" poster="/arcadia/home-background.png" aria-hidden="true">
      <source src="/arcadia/home-background.mp4" type="video/mp4" />
    </video>
    <main class="home">
      <h1 class="logotype home__logotype">
        <img src="/arcadia/logotype.svg" alt="Project Arcadia" />
      </h1>
      <nav class="home__menu" aria-label="Main menu">
        <a class="pill-button" href="/missions.html">
          <img class="pill-button__icon pill-button__icon--idle" src="/arcadia/icon-play.svg" alt="" />
          <img class="pill-button__icon pill-button__icon--active" src="/arcadia/icon-play-active.svg" alt="" />
          <span class="pill-button__label">Start playing</span>
        </a>
        <button class="pill-button" type="button" disabled>
          <img class="pill-button__icon" src="/arcadia/icon-gear.svg" alt="" />
          <span class="pill-button__label">Options</span>
        </button>
        <a class="pill-button" href="/information.html">
          <svg class="pill-button__icon" aria-hidden="true"><use href="/arcadia/hud-icons.svg#info" /></svg>
          <span class="pill-button__label">Information</span>
        </a>
      </nav>
      <img class="home__divider" src="/arcadia/divider.svg" alt="" />
    </main>
  </body>
</html>
