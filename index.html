<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="nebula" aria-hidden="true"></div>

    <main class="launch">
      <div class="planet" aria-hidden="true">
        <span class="planet__ring"></span>
        <span class="planet__moon"></span>
      </div>

      <p class="launch__label">Mission control</p>
      <h1 class="launch__title">Starting <span>soon</span></h1>
      <p class="launch__subtitle">Pre-launch checks in progress. Stay tuned for liftoff.</p>

      <p class="launch__status">
        <span class="launch__dot" aria-hidden="true"></span>
        Systems check
      </p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
