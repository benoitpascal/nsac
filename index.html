<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Arcadia</title>
    <meta name="description" content="Run a base on the Moon and learn the real trade-offs of space engineering." />
    <meta name="theme-color" content="#0f3465" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:title" content="Project Arcadia" />
    <meta property="og:description" content="Run a base on the Moon and learn the real trade-offs of space engineering." />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An astronaut looking at the Earth, the Moon and Mars, with the Project Arcadia logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Project Arcadia" />
    <meta name="twitter:description" content="Run a base on the Moon and learn the real trade-offs of space engineering." />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/hud.css" />
    <link rel="stylesheet" href="/src/cut-button.css" />
    <link rel="stylesheet" href="/src/planning.css" />
    <link rel="stylesheet" href="/src/terminal-menu.css" />
    <link rel="stylesheet" href="/src/home.css" />
  </head>
  <body class="arcadia arcadia--home">
    <video class="page-video" autoplay muted loop playsinline preload="auto" poster="/arcadia/home-background.png" aria-hidden="true">
      <source src="/arcadia/home-background.mp4" type="video/mp4" />
    </video>
    <main class="home">
      <h1 class="logotype home__logotype">
        <img src="/arcadia/logotype.svg" alt="Project Arcadia" />
      </h1>
      <nav class="home__menu" aria-label="Main menu">
        <a id="home-continue" class="cut-button cut-button--wide cut-button--fit" href="/briefing.html" hidden>
          <img class="cut-button__chevrons" src="/arcadia/act-select/chevrons-small.svg" alt="" />
          <span id="home-continue-label">Continue</span>
        </a>
        <a id="home-start" class="cut-button cut-button--primary cut-button--fit" href="/missions.html">
          <img class="cut-button__chevrons" src="/arcadia/act-select/chevrons-small-dark.svg" alt="" />
          Start playing
        </a>
        <button id="home-options" class="cut-button cut-button--wide cut-button--fit" type="button">
          <img class="cut-button__chevrons" src="/arcadia/act-select/chevrons-small.svg" alt="" />
          Options
        </button>
      </nav>
      <section id="home-settings" class="hud-panel home__settings" aria-labelledby="home-settings-title" hidden>
        <h2 id="home-settings-title" class="planning__title">Options</h2>
        <div id="home-settings-cards"></div>
        <button id="home-settings-back" class="cut-button cut-button--text" type="button">
          <img class="cut-button__chevrons" src="/arcadia/act-select/chevrons-small.svg" alt="" />
          Back
        </button>
      </section>
      <img class="home__divider" src="/arcadia/divider.svg" alt="" />
    </main>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
