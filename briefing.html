<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Station dashboard · Project Arcadia</title>
    <meta name="description" content="Your orders for the day at the Moon base." />
    <meta name="theme-color" content="#121d3b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/hud.css" />
    <link rel="stylesheet" href="/src/briefing.css" />
    <link rel="stylesheet" href="/src/band.css" />
    <link rel="stylesheet" href="/src/dashboard.css" />
    <link rel="stylesheet" href="/src/guide.css" />
    <link rel="stylesheet" href="/src/cut-button.css" />
    <link rel="stylesheet" href="/src/planning.css" />
  </head>
  <body class="arcadia arcadia--hud">
    <div class="hud">
      <header class="band">
        <a class="band__logotype" href="/"><img src="/arcadia/logotype.svg" alt="Project Arcadia, home" /></a>
        <h1 class="band__title">Station dashboard</h1>
        <p class="band__info">
          <span id="band-day">Day 01</span>
          <span id="band-sun" class="band__sun" role="img" aria-label="Daytime"></span>
          <time id="band-time"></time>
        </p>
        <span class="band__planet" aria-hidden="true"></span>
        <p class="band__act">Act II</p>
      </header>

      <div
        class="mission-progress"
        id="mission-progress"
        role="progressbar"
        aria-labelledby="mission-progress-label"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <p class="mission-progress__text">
          <span id="mission-progress-label">Main mission progress</span>
          <span id="mission-progress-value">0%</span>
        </p>
        <span class="mission-progress__track"></span>
      </div>

      <main id="guide" class="guide"></main>

      <footer class="terminal-exit">
        <a class="cut-button cut-button--wide" href="/planet-walk.html?at=terminal">
          <img class="cut-button__chevrons" src="/arcadia/act-select/chevrons-small.svg" alt="" />
          Back to game
        </a>
      </footer>
    </div>
    <script type="module" src="/src/briefing.ts"></script>
  </body>
</html>
