<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission training</title>
    <meta name="description" content="Sixteen mini-games to train like an astronaut." />
    <meta name="theme-color" content="#05060f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/src/pages.css" />
  </head>
  <body>
    <a class="page-link" href="/">Back</a>
    <main class="minigames">
      <h1 class="minigames__heading">Mission training</h1>
      <nav id="minigames-menu" class="minigames__menu" aria-label="Mini-games"></nav>
      <section id="minigames-screen" class="minigames__screen" aria-labelledby="minigames-title" hidden>
        <header class="minigames__bar">
          <button id="minigames-quit" class="minigames__action" type="button">All games</button>
          <h2 id="minigames-title" class="minigames__title"></h2>
        </header>
        <div id="minigames-board" class="minigames__board"></div>
        <div id="minigames-result" class="minigames__result" role="status" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/minigames.ts"></script>
  </body>
</html>
