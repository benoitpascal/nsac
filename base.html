<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121d3b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/hud.css" />
    <link rel="stylesheet" href="/src/campaign.css" />
    <title>Planning · Project Arcadia</title>
    <meta name="description" content="Choose what the Moon base builds today." />
  </head>
  <body class="arcadia arcadia--hud">
    <div class="hud">
      <header class="hud__header">
        <a class="logotype hud__logotype" href="/"><img src="/arcadia/logotype.svg" alt="Project Arcadia, home" /></a>
        <h1 class="hud__title">Planning · Day <span id="plan-day">02</span></h1>
        <p class="hud__tag">Act II · Moon</p>
      </header>

      <main class="plan">
        <section class="hud-panel plan__stocks" aria-labelledby="plan-stocks-title">
          <h2 id="plan-stocks-title" class="hud-panel__heading">Base stocks</h2>
          <ul id="plan-stocks" class="plan__stock-list"></ul>
        </section>
        <section class="hud-panel plan__choices" aria-labelledby="plan-choices-title">
          <h2 id="plan-choices-title" class="hud-panel__heading">What do we do today?</h2>
          <p class="plan__intro">Every project costs something. The ones the base cannot pay for stay greyed.</p>
          <ul id="plan-actions" class="plan__actions"></ul>
        </section>
      </main>

      <footer class="hud__footer">
        <a class="hud-back" href="/debrief.html">Last debrief</a>
      </footer>
    </div>
    <script type="module" src="/src/base.ts"></script>
  </body>
</html>
