<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose your act · Project Arcadia</title>
    <meta name="description" content="Pick the act you want to play: Earth, the Moon or Mars." />
    <meta name="theme-color" content="#0b0f1c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/missions.css" />
    <link rel="stylesheet" href="/src/act-choice.css" />
    <link rel="stylesheet" href="/src/cut-button.css" />
  </head>
  <body class="arcadia arcadia--acts" data-planet="earth">
    <div class="acts-backdrop" aria-hidden="true"></div>
    <header class="acts-header">
      <a class="logotype acts-header__logotype" href="/"><img src="/arcadia/logotype.svg" alt="Project Arcadia, home" /></a>
      <span class="acts-header__planet" aria-hidden="true"></span>
    </header>
    <main class="acts">
      <section class="acts__objective" aria-labelledby="acts-objective">
        <h1 id="acts-objective" class="acts__objective-title">Objective</h1>
        <p class="acts__objective-text">
          Your journey has three acts, like a real space program: train on Earth, build a base on the Moon,
          then explore Mars. Every choice you make uses air, power or water, so plan well! For now, the Moon
          act is open.
        </p>
      </section>
      <h2 class="acts__choose">Choose the act you want to play</h2>
      <ul class="acts__list" aria-label="Acts">
        <li>
          <button class="act-choice act-choice--locked" type="button" data-planet="earth" aria-disabled="true">
            <img class="act-choice__picture" src="/arcadia/act-select/card-earth.webp" alt="" />
            <span class="act-choice__text">
              <span class="act-choice__act">Act 1</span>
              <span class="act-choice__planet">Earth</span>
              <span class="act-choice__summary">Train for space</span>
            </span>
            <img class="act-choice__lock" src="/arcadia/act-select/lock.svg" alt="" />
            <span class="visually-hidden">(locked)</span>
          </button>
        </li>
        <li class="acts__chevron" aria-hidden="true"><img src="/arcadia/act-select/chevrons.svg" alt="" /></li>
        <li>
          <button class="act-choice act-choice--open" type="button" data-planet="moon" aria-pressed="false">
            <img class="act-choice__picture" src="/arcadia/act-select/card-moon.webp" alt="" />
            <span class="act-choice__text">
              <span class="act-choice__act">Act 2</span>
              <span class="act-choice__planet">Moon</span>
              <span class="act-choice__summary">Build the Moon base</span>
            </span>
            <span class="act-choice__badge">Demo</span>
          </button>
        </li>
        <li class="acts__chevron" aria-hidden="true"><img src="/arcadia/act-select/chevrons.svg" alt="" /></li>
        <li>
          <button class="act-choice act-choice--locked" type="button" data-planet="mars" aria-disabled="true">
            <img class="act-choice__picture" src="/arcadia/act-select/card-mars.webp" alt="" />
            <span class="act-choice__text">
              <span class="act-choice__act">Act 3</span>
              <span class="act-choice__planet">Mars</span>
              <span class="act-choice__summary">Explore the red planet</span>
            </span>
            <img class="act-choice__lock" src="/arcadia/act-select/lock.svg" alt="" />
            <span class="visually-hidden">(locked)</span>
          </button>
        </li>
      </ul>
      <nav class="acts__actions" aria-label="Act selection">
        <a class="cut-button cut-button--back" href="/">
          <img class="cut-button__chevrons" src="/arcadia/act-select/chevrons-small.svg" alt="" />
          Back
        </a>
        <a class="cut-button cut-button--start" href="/moon-intro.html" aria-disabled="true">
          <img class="cut-button__chevrons" src="/arcadia/act-select/chevrons-small.svg" alt="" />
          Start mission
        </a>
      </nav>
    </main>
    <script type="module" src="/src/missions.ts"></script>
  </body>
</html>
