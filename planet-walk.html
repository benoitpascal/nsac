<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet walk</title>
    <meta name="description" content="Walk and jump on the Moon, Mars and other worlds, and feel their gravity." />
    <meta name="theme-color" content="#05060f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="/src/pages.css" />
    <link rel="stylesheet" href="/src/mission.css" />
  </head>
  <body>
    <main class="planet-walk-page" aria-label="Planet walk">
      <canvas id="planet-walk" class="planet-walk" aria-label="View from the walker's eyes"></canvas>
      <div class="planet-walk__aim" aria-hidden="true"></div>
    </main>

    <a id="walk-back" class="page-link" href="/">Back</a>
    <aside id="mission-panel" class="mission-panel" aria-labelledby="mission-panel-title" aria-live="polite" hidden>
      <h2 id="mission-panel-title" class="mission-panel__title">Day 01 · Today's goals</h2>
      <ul class="mission-panel__list"></ul>
    </aside>
    <dialog id="mission-end" class="mission-end" aria-labelledby="mission-end-title">
      <h2 id="mission-end-title" class="mission-end__title"></h2>
      <p class="mission-end__text"></p>
      <div class="mission-end__actions"></div>
    </dialog>
    <aside id="walk-facts" class="walk-facts" aria-label="Gravity" aria-live="polite"></aside>

    <button id="pilot-prompt" class="pilot-prompt" type="button" hidden></button>
    <p id="excavator-hud" class="excavator-hud" hidden></p>

    <section id="station-dashboard" class="station-dashboard" aria-labelledby="station-dashboard-title" aria-live="polite" hidden>
      <div class="station-dashboard__screen">
        <header class="station-dashboard__header">
          <h2 id="station-dashboard-title" class="station-dashboard__title">Base terminal</h2>
          <button class="station-dashboard__close" type="button" aria-label="Close the dashboard">✕</button>
        </header>
        <ul class="station-dashboard__resources"></ul>
        <p class="station-dashboard__outside"></p>
        <button class="station-dashboard__drive" type="button">Drive the robot</button>
      </div>
    </section>

    <div id="touch-pad" class="touch-pad">
      <div class="touch-pad__cluster" role="group" aria-label="Walk and turn">
        <button class="touch-pad__button touch-pad__button--top" type="button" data-key="ArrowUp" aria-label="Forward">▲</button>
        <button class="touch-pad__button touch-pad__button--left" type="button" data-key="ArrowLeft" aria-label="Turn left">◀</button>
        <button class="touch-pad__button touch-pad__button--right" type="button" data-key="ArrowRight" aria-label="Turn right">▶</button>
        <button class="touch-pad__button touch-pad__button--bottom" type="button" data-key="ArrowDown" aria-label="Back">▼</button>
      </div>
      <div class="touch-pad__cluster" role="group" aria-label="Actions">
        <button class="touch-pad__button touch-pad__button--top" type="button" data-key="Space" aria-label="Jump">Jump</button>
        <button class="touch-pad__button touch-pad__button--left touch-pad__button--action" type="button" data-key="KeyE" aria-label="Action (E)">E</button>
        <button class="touch-pad__button touch-pad__button--right" type="button" data-key="ShiftLeft" aria-label="Run">Run</button>
        <button class="touch-pad__button touch-pad__button--bottom" type="button" data-key="KeyV" aria-label="Change the view">View</button>
      </div>
    </div>

    <div class="walk-controls">
      <div id="world-picker" class="speed-picker" role="group" aria-label="World to walk on"></div>
      <ul class="walk-keys" aria-label="Keyboard controls">
        <li><kbd>Z Q S D</kbd> or <kbd>↑ ← ↓ →</kbd> walk</li>
        <li><kbd>Shift</kbd> run</li>
        <li><kbd>Space</kbd> jump</li>
        <li><kbd>E</kbd> use</li>
        <li><kbd>V</kbd> change view</li>
      </ul>
    </div>

    <script type="module" src="/src/planet-walk.ts"></script>
  </body>
</html>
