# Scheme the visitor used, even when a proxy terminates HTTPS in front of nginx.
map $http_x_forwarded_proto $site_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 3000;
    listen [::]:3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Absolute links in the share tags follow the domain the site is served from.
        sub_filter '__SITE_ORIGIN__' '$site_scheme://$host';
        sub_filter_once off;
    }
}
