<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121d3b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/hud.css" />
    <link rel="stylesheet" href="/src/campaign.css" />

    <meta name="description" content="A hands-on task at the Moon base." />

  <body class="arcadia arcadia--hud">
    <div class="hud">
      <header class="hud__header">
        <a class="logotype hud__logotype" href="/"><img src="/arcadia/logotype.svg" alt="Project Arcadia, home" /></a>
        <h1 id="challenge-title" class="hud__title">Challenge</h1>
        <p class="hud__tag">Act II · Moon</p>

      <main class="challenge">
        <p id="challenge-story" class="challenge__story"></p>
        <div id="challenge-board" class="minigames__board challenge__board"></div>
        <div id="challenge-result" class="hud-panel challenge__result" role="status" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/challenge.ts"></script>
  </body>
