<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day one · Project Arcadia</title>
    <meta name="description" content="Your first day at the Moon base." />
    <meta name="theme-color" content="#0f3465" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/day-one.css" />
    <link rel="stylesheet" href="/src/status-card.css" />
  </head>
  <body class="arcadia arcadia--day-one">
    <main class="day-one">
      <div class="day-one__title-clip">
        <h1 class="day-one__title"><span>Day</span> <span>one</span></h1>
      </div>
      <img class="day-one__line" src="/arcadia/day-one-line.svg" alt="" />
      <ul class="day-one__status" aria-label="Base status">
        <li class="status-card">
          <span class="status-card__icon" aria-hidden="true"></span>
          <span class="status-card__value">-150 °C</span>
          <span class="status-card__label">Temperature</span>
        </li>
        <li class="status-card">
          <span class="status-card__icon" aria-hidden="true"></span>
          <span class="status-card__value">daylight</span>
          <span class="status-card__label">solar status</span>
        </li>
        <li class="status-card">
          <span class="status-card__icon" aria-hidden="true"></span>
          <span class="status-card__value">06/06</span>
          <span class="status-card__label">Crew status</span>
        </li>
      </ul>
      <a class="pill-button day-one__next" href="/briefing.html">
        <img class="pill-button__icon pill-button__icon--idle" src="/arcadia/icon-play.svg" alt="" />
        <img class="pill-button__icon pill-button__icon--active" src="/arcadia/icon-play-active.svg" alt="" />
        <span class="pill-button__label">Continue</span>
      </a>
    </main>
  </body>
</html>
