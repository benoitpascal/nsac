<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission · Project Arcadia</title>
    <meta name="description" content="Play today's mission at the Moon base." />
    <meta name="theme-color" content="#05060f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/hud.css" />
    <link rel="stylesheet" href="/src/band.css" />
    <link rel="stylesheet" href="/src/pages.css" />
  </head>
  <body class="arcadia arcadia--hud">
    <div class="hud">
      <header class="band">
        <a class="band__logotype" href="/"><img src="/arcadia/logotype-white.svg" alt="Project Arcadia, home" /></a>
        <h1 class="band__title">Mission</h1>
        <p class="band__info">
          <span id="band-day">Day 01</span>
          <span id="band-sun" class="band__sun" role="img" aria-label="Daytime"></span>
          <time id="band-time"></time>
        </p>
        <span class="band__planet" aria-hidden="true"></span>
        <p class="band__act">Act II</p>
      </header>

      <div
        class="mission-progress"
        id="mission-progress"
        role="progressbar"
        aria-labelledby="mission-progress-label"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <p class="mission-progress__text">
          <span id="mission-progress-label">Main mission progress</span>
          <span id="mission-progress-value">0%</span>
        </p>
        <span class="mission-progress__track"></span>
      </div>

    <main class="minigames">
      <section class="minigames__screen" aria-labelledby="mission-title">
        <header class="minigames__bar">
          <h1 id="mission-title" class="minigames__title"></h1>
        </header>
        <section id="mission-howto" class="minigames__howto" aria-label="How to play"></section>
        <div id="mission-board" class="minigames__board"></div>
      </section>
    </main>
    </div>
    <script type="module" src="/src/mission.ts"></script>
  </body>
</html>
